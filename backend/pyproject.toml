[project]
name = "aistudyos-backend"
version = "0.1.0"
description = "AI StudyOS FastAPI backend (Phase 0 foundation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "SQLAlchemy==2.0.43",
    "alembic==1.16.5",
    "psycopg2-binary==2.9.10",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "PyJWT==2.10.1",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.3",
    "PyMuPDF==1.26.4",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
